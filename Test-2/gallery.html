<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LS Properties — Shell bezichtiging</title>
<meta name="description" content="Bekijk alle beschikbare shells in preview en vergroot de foto's.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>

<div class="grain"></div>

<header class="site-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 48 54" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M24 1L45 10V26C45 39 36 48.5 24 53C12 48.5 3 39 3 26V10L24 1Z" stroke="currentColor" stroke-width="1.5"/>
      <path d="M24 8L38 14V26C38 35.5 32 42.5 24 46C16 42.5 10 35.5 10 26V14L24 8Z" stroke="currentColor" stroke-width="1"/>
      <text x="24" y="30" text-anchor="middle" font-family="Fraunces, serif" font-size="15" font-weight="600" fill="currentColor">LS</text>
    </svg>
    <span class="brand-name">LS&nbsp;Properties</span>
  </div>
  <span class="brand-tag">Makelaardij &amp; Eigendomsbeheer</span>
</header>

<section class="hero">
  <p class="eyebrow">Preview</p>
  <h1>Shell bezichtiging</h1>
  <p class="hero-sub">Bekijk shells in preview.</p>
</section>

<main class="gallery-main">

  <a class="back-link" href="index.html">&larr; Terug naar Dashboard</a>

  <h2 class="gallery-title">Bezichtiging Shells</h2>
  <p class="gallery-sub">Gebruik de filters om een shell te vinden die bij je past.</p>

  <div class="panel filter-panel">
    <div class="field" style="margin-bottom:0;">
      <label for="floorFilter">Verdiepingen</label>
      <div class="select-wrap">
        <select id="floorFilter">
          <option value="all">Alle verdiepingen</option>
        </select>
      </div>
    </div>
  </div>

  <div class="shell-grid" id="shellGrid"></div>

  <p class="no-results" id="noResults" hidden>Geen shells gevonden voor deze filter.</p>

</main>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> LS Properties — Alle rechten voorbehouden.</p>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Sluiten">&times;</button>
  <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Vorige foto">&#8249;</button>
  <div class="lb-frame">
    <img class="lb-image" id="lbImage" src="" alt="">
    <div class="lb-caption">
      <span class="lb-name" id="lbName"></span>
      <span class="lb-count" id="lbCount"></span>
    </div>
  </div>
  <button class="lb-arrow lb-next" id="lbNext" aria-label="Volgende foto">&#8250;</button>
</div>

<script src="gallery.js"></script>
</body>
</html>
