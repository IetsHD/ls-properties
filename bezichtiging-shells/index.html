<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Shell bezichtiging | LS Properties</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img class="logo" src="../assets/ls-properties-logo.png" alt="LS Properties">
    <h1>Shell bezichtiging</h1>
    <p>bekijk shells in preview</p>
  </header>

  <main class="page-shell">
    <a class="back-link" href="../index.html">← Terug naar Dashboard</a>

    <section class="intro" aria-labelledby="shell-title">
      <h2 id="shell-title">Bezichtiging Shells</h2>
      <p>Gebruik de filters om een shell te vinden die bij je past.</p>
    </section>

    <section class="filter-card" aria-label="Filters">
      <label for="floorFilter">VERDIEPINGEN</label>
      <select id="floorFilter">
        <option value="all">Alle verdiepingen</option>
        <option value="1">1 verdieping</option>
        <option value="2">2 verdiepingen</option>
        <option value="3">3 verdiepingen</option>
      </select>
    </section>

    <section id="shellGrid" class="shell-grid" aria-live="polite"></section>
    <p id="emptyState" class="empty-state" hidden>Geen shells gevonden met dit filter.</p>
  </main>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Vergrote shell afbeelding">
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Sluiten">×</button>
    <button id="lightboxPrev" class="lightbox-nav lightbox-prev" type="button" aria-label="Vorige foto">‹</button>
    <figure class="lightbox-content">
      <img id="lightboxImage" class="lightbox-image" src="" alt="">
      <figcaption id="lightboxCaption" class="lightbox-caption"></figcaption>
    </figure>
    <button id="lightboxNext" class="lightbox-nav lightbox-next" type="button" aria-label="Volgende foto">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
